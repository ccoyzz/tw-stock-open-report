name: daily
on:
  schedule:
    # GitHub 排程只認 UTC，而且可能延遲很久甚至漏掉，所以排多個啟動時間。
    # 程式會自己等到台灣時間 09:00:30；今天資料已完整時，後到的執行會直接結束。
    - cron: "30 23 * * 0-4" # 台灣時間平日 07:30
    - cron: "0 0 * * 1-5" # 08:00
    - cron: "30 0 * * 1-5" # 08:30
    - cron: "50 0 * * 1-5" # 08:50
    - cron: "10 1 * * 1-5" # 09:10
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data-branch
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -t .
      - run: |
          git -C data-branch config user.name "github-actions[bot]"
          git -C data-branch config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python -m twopen.run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TWOPEN_PUBLISH_DIR: data-branch
