name: daily
on:
  schedule:
    - cron: "30 0 * * 1-5" # 台灣時間平日 08:30（GitHub 排程只認 UTC）
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data-branch
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -t .
      - run: |
          git -C data-branch config user.name "github-actions[bot]"
          git -C data-branch config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python -m twopen.run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TWOPEN_PUBLISH_DIR: data-branch
